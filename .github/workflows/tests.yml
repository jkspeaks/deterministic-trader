name: Tests

# The offline suite. No secrets, no network beyond installing dependencies.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run the suite
        run: |
          uv sync --group dev --group mcp
          uv run pytest
